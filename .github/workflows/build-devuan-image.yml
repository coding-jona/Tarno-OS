name: Build Tarno OS Devuan image (experimental)

on:
  workflow_dispatch: {}

jobs:
  build-devuan-image:
    name: live-build (tarno-devuan-live, Devuan excalibur)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: build tarnod, tarno-disk-install, tarnoctl
        run: |
          mkdir -p tarno-devuan-live/config/includes.chroot/usr/bin
          GOOS=linux GOARCH=amd64 go build -o tarno-devuan-live/config/includes.chroot/usr/bin/tarnod .
          GOOS=linux GOARCH=amd64 go build -o tarno-devuan-live/config/includes.chroot/usr/bin/tarno-disk-install ./cmd/tarno-disk-install
          GOOS=linux GOARCH=amd64 go build -o tarno-devuan-live/config/includes.chroot/usr/bin/tarnoctl ./cmd/tarnoctl

      - name: install live-build host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build squashfs-tools xorriso syslinux-utils

      # ubuntu's debootstrap doesn't ship devuan suite scripts (excalibur
      # etc), pull devuan's own package instead
      - name: install devuan's debootstrap + keyring
        run: |
          set -eu

          fetch_pinned_or_latest () {
            pkg_dir="$1"
            pinned_file="$2"
            out="$3"

            url="http://deb.devuan.org/devuan/pool/main/d/${pkg_dir}/${pinned_file}"
            if curl -fsSL -o "${out}" "${url}"; then
              return 0
            fi

            echo "pinned ${pinned_file} is gone, falling back to latest in pool listing" >&2
            listing_url="http://deb.devuan.org/devuan/pool/main/d/${pkg_dir}/"
            latest_file="$(curl -fsSL "${listing_url}" \
              | grep -oE "${pkg_dir}_[^\"']+_(all|amd64)\.deb" \
              | sort -V | tail -n1)"
            [ -n "${latest_file}" ] || { echo "no ${pkg_dir} .deb found" >&2; exit 1; }
            curl -fsSL -o "${out}" "${listing_url}${latest_file}"
          }

          fetch_pinned_or_latest debootstrap debootstrap_1.0.134devuan2_all.deb /tmp/devuan-debootstrap.deb
          fetch_pinned_or_latest devuan-keyring devuan-keyring_2025.08.09_all.deb /tmp/devuan-keyring.deb

          sudo dpkg -i /tmp/devuan-debootstrap.deb /tmp/devuan-keyring.deb || true
          sudo apt-get install -f -y

      - name: verify debootstrap is devuan's
        run: |
          set -eu
          version="$(debootstrap --version)"
          echo "${version}"
          case "${version}" in
            *devuan*) ;;
            *) echo "not devuan's debootstrap, lb build would fail" >&2; exit 1 ;;
          esac

      - name: lb config
        working-directory: tarno-devuan-live
        run: sudo lb config

      # actions' default shell is bash -e without pipefail, so tee's exit
      # code (not lb build's) would decide success - set it explicitly
      - name: lb build
        working-directory: tarno-devuan-live
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log

      - name: check result
        working-directory: tarno-devuan-live
        run: |
          image="$(find . -maxdepth 1 -name '*.iso' | head -n1)"
          [ -n "${image}" ] || { echo "no .iso produced" >&2; exit 1; }
          file "${image}"
          sha256sum "${image}" | tee "${image}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tarno-os-devuan-iso
          path: |
            tarno-devuan-live/*.iso
            tarno-devuan-live/*.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devuan-live-build-log
          path: tarno-devuan-live/build.log
          if-no-files-found: ignore

  qemu-smoke-test:
    name: boot the ISO in QEMU and check it actually reaches a desktop
    needs: build-devuan-image
    runs-on: ubuntu-latest
    # A first real run against this ISO timed out completely at 30
    # (with a 900s in-script boot timeout) with zero serial output the
    # whole time - not a crash, just a live-boot+OpenRC+labwc boot that
    # plain TCG (no confirmed /dev/kvm access) genuinely didn't finish
    # in time. Both this and the script's own BOOT_TIMEOUT raised
    # together, with headroom past qemu-smoke-test.py's now-2400s
    # boot wait for setup, the post-login command round trips, and
    # cleanup.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tarno-os-devuan-iso
          path: .

      # Best-effort KVM acceleration - standard GitHub-hosted runners
      # have had /dev/kvm since ~2023, just not group-writable by
      # default (this is the same fix the Android-emulator CI action
      # ecosystem uses). qemu-smoke-test.py falls back to plain TCG
      # (slower, still correct) if this doesn't pan out, so this step
      # is an optimization, not a hard requirement.
      - name: enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: install qemu + pexpect
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpu-checker
          pip install --quiet pexpect

      # Purely informational (never fails the job) - the previous run
      # timed out with no way to tell whether KVM was actually in play
      # or this was plain TCG the whole time. qemu-smoke-test.py prints
      # its own has_kvm() check too, but kvm-ok additionally reports
      # *why* not (missing CPU extension vs. permission vs. no device
      # at all), which /dev/kvm-open-and-see can't distinguish.
      - name: check KVM availability (informational)
        run: kvm-ok || true

      - name: boot smoke test
        run: |
          image="$(find . -maxdepth 1 -name '*.iso' | head -n1)"
          [ -n "${image}" ] || { echo "no ISO artifact found" >&2; exit 1; }
          python3 scripts/qemu-smoke-test.py "${image}"
