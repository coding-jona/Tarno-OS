name: CI

# Baut und testet die Rust-Crates dieses Repos (tarnod-Workspace: Daemon,
# CLI, Protocol).
#
# Baut NICHT das eigentliche Tarno-OS-Boot-Image (`sdcard.img`) — das ist
# ein separater, mehrstündiger Buildroot-Build, siehe
# docs/month1-foundation.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (tarnod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: apt-Abhängigkeiten
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: tarnod-Workspace (Daemon, CLI, Protocol)
        working-directory: tarnod
        run: |
          cargo build --workspace
          cargo test --workspace
      - name: shellcheck (scripts/)
        run: shellcheck scripts/*.sh
