# SPDX-License-Identifier: GPL-2.0-or-later
name: qemu-boot (Phase 1-2: + xHCI keyboard + shell + boot picker)

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          # rust-toolchain.toml pins the nightly; this just makes the target present.
          rustup show active-toolchain || rustup toolchain install nightly --profile minimal
          rustup target add x86_64-unknown-none
          rustup component add rust-src llvm-tools
          rustup target add x86_64-unknown-linux-musl
          rustup target add x86_64-unknown-uefi

      - name: Install QEMU + xorriso + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 xorriso ovmf e2fsprogs binutils mtools dosfstools

      - name: Build Limine
        run: make -C third_party/limine

      - name: Build kernel + ISO
        run: cargo xtask iso

      - name: Boot in QEMU and assert milestone output
        run: |
          set -o pipefail
          timeout 60 cargo xtask run 2>&1 | tee boot.log || true
          grep -q "THOS: kmain reached (Milestone 0)" boot.log
          grep -q "THOS: framebuffer painted" boot.log
          grep -q "THOS: GDT + IDT loaded" boot.log
          grep -q "THOS: traps ok (returned from #BP)" boot.log
          grep -q "THOS: usable RAM" boot.log
          grep -q "THOS: heap smoke ok" boot.log
          grep -q "THOS: frame alloc ok" boot.log
          grep -q "THOS: ACPI rev" boot.log
          grep -qE "THOS: CPUs +4 \(4 enabled" boot.log
          grep -q "THOS: IOAPIC id" boot.log
          grep -q "THOS: APIC timer ok" boot.log
          grep -qE "THOS: SMP +4/4 CPUs online" boot.log
          grep -q "THOS: sched ok" boot.log
          grep -q "THOS: own page tables" boot.log
          grep -q "hello from the ram fs" boot.log
          grep -q "THOS: vfs ok" boot.log
          grep -q "THOS: ahci ok" boot.log
          grep -q "THOS: ext2 ok" boot.log
          grep -q "THOS: elf ok" boot.log
          grep -q "child ran" boot.log
          grep -q "parent done" boot.log
          grep -q "a file read via open" boot.log
          grep -q "THOS: fork/exec/wait4  ok" boot.log
          grep -q "hello from a static musl Rust binary" boot.log
          grep -q "THOS: musl binary ok" boot.log
          grep -q "THOS: ahci write ok" boot.log
          grep -q "THOS: ext2 write ok" boot.log
          grep -q "THOS: ext2 unlink ok" boot.log
          grep -q "THOS: xhci ok" boot.log
          grep -q "THOS: wait primitive" boot.log
          grep -q "THOS: halting." boot.log

      - name: Interactive shell end-to-end (first-run setup + login, then run `init`)
        run: cargo xtask kbd-test

      - name: Login end-to-end (setup once, login on reboot, wrong password rejected)
        run: cargo xtask login-test

      - name: Boot picker end-to-end (3 fake disks under OVMF, chainload the default)
        run: cargo xtask bootpick-test

      - name: AHCI write end-to-end (kernel round-trip + host verifies it persisted)
        run: cargo xtask ahci-test

      - name: ext2 write end-to-end (kernel creates files; host e2fsck + debugfs verify)
        run: cargo xtask ext2-test

      - name: SMP scheduler stress (24 vCPUs; hundreds of threads churn/block/fork)
        run: cargo xtask smp-test
