[package]
name = "tarnod-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Natives GUI fuer tarnod (egui/eframe): Gaming-Mode, Security-Status, API-Keys"

[[bin]]
name = "tarnod-ui"
path = "src/main.rs"

[dependencies]
tarnod-protocol.workspace = true
tarno-ui-theme = { path = "../../tarno-ui-theme" }
serde_json.workspace = true
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "persistence", "x11", "wayland"] }
egui = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
