[workspace]
resolver = "2"
members = ["tarnod", "tarnoctl"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "signal", "time"] }
libc = "0.2"
anyhow = "1"
