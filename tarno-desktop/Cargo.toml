[package]
name = "tarno-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Tarno OS Desktop-Modus: eigener minimaler Wayland-Compositor mit direkt eingebauter Taskleiste (kein separater Panel-Client). Gaming-Modus nutzt weiterhin cage (siehe docs/architecture.md)."

[[bin]]
name = "tarno-desktop"
path = "src/main.rs"

[dependencies]
tarno-ui-theme = { path = "../tarno-ui-theme" }
tarnod-protocol = { path = "../tarnod/tarnod-protocol" }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "renderer_glow",
    "wayland_frontend",
    "desktop",
] }
serde_json = "1"
fontdue = "0.9"
libc = "0.2"
