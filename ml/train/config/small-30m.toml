# SPDX-License-Identifier: GPL-2.0-or-later
# Track A P1 — a ~30M-parameter byte-BPE GPT. Trainable on the i7-13700KF CPU
# over a long run (order of a day). Bump max_steps as the loss allows.
#
#   CONFIG=ml/train/config/small-30m.toml ml/train/run.sh train-bg

[model]
n_layer    = 8
n_head     = 8
n_embd     = 512
block_size = 256
vocab_size = 16384     # set by prepare.py --bpe 16384
dropout    = 0.1
norm_eps   = 1e-5

[train]
seed          = 20260904
batch_size    = 24
grad_accum    = 2        # effective batch 48 -- lowered from 8 for faster/more
                         # frequent steps (more gradient noise, but 48 is
                         # still a reasonable batch for a 30M model)
# ~30 s/optimizer-step on the i7-13700KF (CPU). 20k steps ~ 6-7 days of compute;
# stop any time — checkpoints keep progress, export + run in the shell.
max_steps     = 20000
warmup_steps  = 800
lr            = 6e-4
min_lr        = 6e-5
weight_decay  = 0.1
grad_clip     = 1.0
# 30 steps ~ 15 min at ~30 s/step — the dashboard felt "dead" at 300/200
# (2.5h / 1.7h between updates); this keeps live feedback actually live.
# eval_batches trimmed too — each is a real forward pass, not free.
eval_interval = 30
eval_batches  = 10
ckpt_interval = 30
num_threads   = 0        # 0 => torch default (all cores)

[data]
train_bin = "data/train.bin"
val_bin   = "data/val.bin"
