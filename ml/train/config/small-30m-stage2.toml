# Track A P1 — Stage 2: the real pretraining run for the ~34M byte-BPE GPT.
# Same model as small-30m but ctx 512 and a much longer schedule over the
# open web/edu corpus (data_stage2/, ~1.2B tokens: TinyStories + FineWeb-Edu +
# Wikipedia + Cosmopedia). See ml/train/fetch_web.py + prepare_web.py.
#
#   CONFIG=ml/train/config/small-30m-stage2.toml ml/train/run.sh train-bg
#   # then, to game while it runs:  ml/train/run.sh game on
#
# NOTE: uses its own tokenizer (data_stage2/tokenizer.json, re-learned on the
# new mix) so this is a FRESH run — not --resume-able from the small-30m P0
# checkpoint.

[model]
n_layer    = 8
n_head     = 8
n_embd     = 512
block_size = 512        # up from 256 — 2x tokens/step, 4x attention; ok at 34M
vocab_size = 16384      # set by prepare_web.py (byte-BPE on the stage-2 sample)
dropout    = 0.1
norm_eps   = 1e-5

[train]
seed          = 20260909
batch_size    = 24
grad_accum    = 2        # effective batch 48; 24576 tokens/step at ctx 512
# ~1.2B-token corpus. 120k steps ~ 2.95B token-passes (~2.5 epochs, ~85
# tokens/param) — the overtrained regime that suits a tiny model. Multi-day
# on the capped (6-core / game-mode) CPU; checkpoints keep progress.
max_steps     = 120000
warmup_steps  = 2000
lr            = 6e-4
min_lr        = 6e-5
weight_decay  = 0.1
grad_clip     = 1.0
# Longer run -> less frequent eval/ckpt (each eval is real forward passes).
eval_interval = 100
eval_batches  = 20
ckpt_interval = 100
num_threads   = 0        # 0 => torch default; game-mode caps via cgroup anyway

[data]
train_bin = "data_stage2/train.bin"
val_bin   = "data_stage2/val.bin"
