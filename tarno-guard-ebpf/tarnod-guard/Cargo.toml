[package]
name = "tarnod-guard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Userspace-Loader für tarnod-guard-ebpf: lädt/attached das eBPF-Programm, liest RingBuf-Events, wendet die Policy an"

[lib]
name = "tarnod_guard"
path = "src/lib.rs"

[[bin]]
name = "tarnod-guard-standalone"
path = "src/main.rs"

[dependencies]
aya = { workspace = true }
aya-log = { workspace = true }
tarnod-guard-common = { workspace = true, features = ["user"] }
anyhow = { workspace = true }
libc = "0.2"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "signal", "macros", "time", "io-util"] }
log = "0.4"
env_logger = "0.11"
