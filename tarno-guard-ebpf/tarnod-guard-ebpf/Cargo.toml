[package]
name = "tarnod-guard-ebpf"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tarnod-guard"
path = "src/main.rs"

[dependencies]
aya-ebpf = { workspace = true }
aya-log-ebpf = { workspace = true }
tarnod-guard-common = { workspace = true }

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
