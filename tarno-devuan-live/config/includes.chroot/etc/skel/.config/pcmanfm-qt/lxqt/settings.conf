# Overrides pcmanfm-qt's package defaults (/usr/share/pcmanfm-qt/lxqt/
# settings.conf) for real, matching what this image actually ships -
# copied into the live user's home from /etc/skel at account creation
# (adduser's normal behavior), so this is a real per-user default, not
# a change to a package-owned file.
#
# Reported: "Operation not supported" / "No such file or directory"
# doing basic file operations. Root-caused against the package's own
# stock defaults and actual dependency list:
#   - Terminal=qterminal, Archiver=lxqt-archiver - neither is installed
#     here (not in pcmanfm-qt's Depends/Recommends at all), so "Open
#     Terminal"/"Extract Here" would fail outright.
#   - UseTrash=true - GIO's trash implementation can fail with exactly
#     "Operation not supported" on a live system's overlay/union root
#     filesystem (this image boots via live-boot's overlay over a
#     read-only squashfs) - a well-known class of issue on live media,
#     not something fixable from a settings file. Disabled: Delete
#     just deletes for real instead of risking a broken trash on this
#     root, which every mainstream live distro's file manager also
#     does by default for the same reason.
[System]
IconThemeName=Papirus
Terminal=foot
Archiver=xarchiver

[Behavior]
UseTrash=false
ConfirmDelete=true
