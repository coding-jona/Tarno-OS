# No animations anywhere in this image - they cost real frame time on
# modest hardware for zero functional benefit. gtk-enable-animations
# covers every GTK3 app's menu/tooltip/notebook-tab/switch fades:
# Geany, GTK file/print dialogs, GIMP, Inkscape, Audacity's GTK bits,
# and waybar itself (it's a GTK3 app under the hood, same setting
# applies to its own tooltip fade-in). labwc has no animation system
# at all to begin with (it's deliberately effect-free, unlike KWin/
# Mutter), and fuzzel doesn't animate either - nothing to disable
# there. Copied into the live user's home from /etc/skel at account
# creation, same mechanism as pcmanfm-qt's settings.conf.
[Settings]
gtk-enable-animations=false
