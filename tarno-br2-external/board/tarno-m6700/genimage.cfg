# Beschreibt das finale USB-Boot-Image (Standard-Buildroot-Pattern: kleine
# vfat-Boot-Partition mit Kernel+SYSLINUX, ext4-Rootfs-Partition dahinter).
# Wird von board/tarno-m6700/post-image.sh über `genimage` aufgerufen.
# Siehe docs/month1-foundation.md#usb-boot-image-anforderung-installationauslieferung-per-usb-stick.
#
# TODO (Scope-Hinweis): Dieses Layout ist nach dem Standard-genimage-Muster
# für SYSLINUX-BIOS-Boot geschrieben, aber NICHT gegen einen echten
# Buildroot+genimage-Lauf verifiziert. Insbesondere die Installation des
# MBR-Bootstrap-Codes (erste 440 Byte, `mbr.bin` aus host-syslinux) passiert
# NICHT hier, sondern als zusätzlicher `dd`-Schritt in post-image.sh — beim
# ersten echten Build prüfen, ob genimage in der verwendeten Version das
# stattdessen direkt unterstützt (spart den manuellen Schritt).

image boot.vfat {
	vfat {
		files = {
			"syslinux.cfg",
			"bzImage"
		}
	}
	size = 16M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
