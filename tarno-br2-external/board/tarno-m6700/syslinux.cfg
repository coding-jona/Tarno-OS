# SYSLINUX-Bootmenü für das USB-Boot-Image (siehe
# docs/month1-foundation.md#usb-boot-image-anforderung-installationauslieferung-per-usb-stick).
#
# root=/dev/sda2: zweite Partition des genimage-Layouts (board/tarno-m6700/genimage.cfg)
# — Boot-Partition (vfat, enthält diese Datei + bzImage) ist /dev/sda1.
# Auf dem tatsächlichen USB-Stick kann der Geräteknoten abweichen (sdb, sdc, ...);
# die Partitionsreihenfolge innerhalb des Sticks bleibt aber sda1/sda2-äquivalent,
# da der Kernel USB-Sticks als "sdX" mit fortlaufenden Partitionen sieht.

DEFAULT tarno-os
TIMEOUT 20
PROMPT 1

LABEL tarno-os
    LINUX bzImage
    APPEND root=/dev/sda2 rootwait ro console=tty0 console=ttyS0,115200
